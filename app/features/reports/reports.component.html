<div class="reports-container">
    <h2>Business Reports</h2>

    <!-- Summary Cards -->
    <div class="summary-cards">
        <mat-card class="stat-card">
            <mat-icon>people</mat-icon>
            <div class="stat-info">
                <span class="stat-value">{{ totalCustomers }}</span>
                <span class="stat-label">Total Customers</span>
            </div>
        </mat-card>

        <mat-card class="stat-card">
            <mat-icon>trending_up</mat-icon>
            <div class="stat-info">
                <span class="stat-value">{{ totalPipelineValue | currency:'EUR':'symbol':'1.0-0' }}</span>
                <span class="stat-label">Total Pipeline</span>
            </div>
        </mat-card>

        <mat-card class="stat-card">
            <mat-icon>check_circle</mat-icon>
            <div class="stat-info">
                <span class="stat-value">{{ totalWonValue | currency:'EUR':'symbol':'1.0-0' }}</span>
                <span class="stat-label">Revenue Won</span>
            </div>
        </mat-card>
    </div>

    <!-- Chart -->
    <mat-card class="chart-card">
        <mat-card-header>
            <mat-card-title>Customers by Company</mat-card-title>
            <mat-card-subtitle>Distribution of your client base</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content class="chart-content">
            <canvas baseChart [data]="barChartData" [options]="barChartOptions" [type]="'bar'">
            </canvas>
        </mat-card-content>
    </mat-card>
</div>
