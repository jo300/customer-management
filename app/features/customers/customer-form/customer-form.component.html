<form [formGroup]="form" (ngSubmit)="onSubmit()" class="customer-form">
    <mat-card-title>{{ mode === 'edit' ? 'Edit Customer' : 'Create Customer' }} </mat-card-title>
    <!-- First Name (required) -->
    <mat-form-field appearance="outline">
        <mat-label i18n="@@formFirstName">First Name</mat-label>
        <input matInput formControlName="firstName" autocomplete="given-name" />
        <mat-error *ngIf="firstName.hasError('required')" i18n="@@formFirstNameRequired">
            First name is required
        </mat-error>
    </mat-form-field>

    <!-- Last Name (required) -->
    <mat-form-field appearance="outline">
        <mat-label i18n="@@formLastName">Last Name</mat-label>
        <input matInput formControlName="lastName" autocomplete="family-name" />
        <mat-error *ngIf="lastName.hasError('required')" i18n="@@formLastNameRequired">
            Last name is required
        </mat-error>
    </mat-form-field>

    <!-- Email (required + email validation) -->
    <mat-form-field appearance="outline">
        <mat-label i18n="@@formEmail">Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error *ngIf="email.hasError('required')" i18n="@@formEmailRequired">
            Email is required
        </mat-error>
        <mat-error *ngIf="email.hasError('email') && !email.hasError('required')" i18n="@@formEmailInvalid">
            Please enter a valid email address
        </mat-error>
        <mat-error *ngIf="email.hasError('duplicateEmail')">
            A customer with this email already exists.
        </mat-error>
    </mat-form-field>

    <!-- Phone (optional) -->
    <mat-form-field appearance="outline">
        <mat-label i18n="@@formPhone">Phone (optional)</mat-label>
        <input matInput type="tel" formControlName="phone" appPhoneFormat autocomplete="tel" />
    </mat-form-field>

    <!-- Company (optional) -->
    <mat-form-field appearance="outline">
        <mat-label i18n="@@formCompany">Company (optional)</mat-label>
        <input matInput formControlName="company" autocomplete="organization" />
    </mat-form-field>

    <!-- Actions -->
    <div class="form-actions">
        <button mat-button type="button" (click)="onCancel()" i18n="@@formCancel">Cancel</button>
        <button mat-raised-button color="primary" type="submit" i18n="@@formSubmit">
            {{ mode === 'edit' ? 'Save Changes ' : 'Create Customer' }}
        </button>
    </div>
</form>
