<form [formGroup]="form" (ngSubmit)="onSubmit()" class="customer-form">
    <!-- First Name (required) -->
    <mat-form-field appearance="outline">
        <mat-label>First Name</mat-label>
        <input matInput formControlName="firstName" autocomplete="given-name" />
        <mat-error *ngIf="firstName.hasError('required')">
            First name is required
        </mat-error>
    </mat-form-field>

    <!-- Last Name (required) -->
    <mat-form-field appearance="outline">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="lastName" autocomplete="family-name" />
        <mat-error *ngIf="lastName.hasError('required')">
            Last name is required
        </mat-error>
    </mat-form-field>

    <!-- Email (required + email validation) -->
    <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error *ngIf="email.hasError('required')">
            Email is required
        </mat-error>
        <mat-error *ngIf="email.hasError('email') && !email.hasError('required')">
            Please enter a valid email address
        </mat-error>
    </mat-form-field>

    <!-- Phone (optional) -->
    <mat-form-field appearance="outline">
        <mat-label>Phone (optional)</mat-label>
        <input matInput type="tel" formControlName="phone" autocomplete="tel" />
    </mat-form-field>

    <!-- Company (optional) -->
    <mat-form-field appearance="outline">
        <mat-label>Company (optional)</mat-label>
        <input matInput formControlName="company" autocomplete="organization" />
    </mat-form-field>

    <!-- Actions -->
    <div class="form-actions">
        <button mat-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit">
            {{ mode === 'edit' ? 'Save Changes' : 'Create Customer' }}
        </button>
    </div>
</form>
