<div class="login-container">
    <mat-card class="login-card">
        <mat-card-header>
            <mat-card-title i18n="@@loginTitle">Login</mat-card-title>
            <mat-card-subtitle i18n="@@loginSubtitle">Customer Management</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
                <mat-form-field appearance="outline">
                    <mat-label i18n="@@loginEmail">Email</mat-label>
                    <input matInput type="email" formControlName="email" autocomplete="email" />
                    <mat-error *ngIf="email.hasError('required')" i18n="@@loginEmailRequired">Email is
                        required</mat-error>
                    <mat-error *ngIf="email.hasError('email') && !email.hasError('required')"
                        i18n="@@loginEmailInvalid">
                        Please enter a valid email
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label i18n="@@loginPassword">Password</mat-label>
                    <input matInput type="password" formControlName="password" autocomplete="current-password" />
                    <mat-error *ngIf="password.hasError('required')" i18n="@@loginPasswordRequired">Password is
                        required</mat-error>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="isLoading" class="login-btn">
                    <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
                    <span *ngIf="!isLoading" i18n="@@loginSignIn">Sign In</span>
                </button>
            </form>

            <p class="hint" i18n="@@loginDemoCredentials">
                Demo credentials: <strong>admintest.com</strong> / <strong>password123</strong>
            </p>
        </mat-card-content>
    </mat-card>
</div>
